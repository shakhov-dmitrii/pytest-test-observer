# `make install` runs `pre-commit install`, which wires up both hook types below.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: make-format
        name: Format code (make format)
        entry: make format
        language: system
        pass_filenames: false
        types: [python]

      - id: make-lint
        name: Lint code (make lint)
        entry: make lint
        language: system
        pass_filenames: false
        types: [python]

      - id: make-typecheck
        name: Type check (make typecheck)
        entry: make typecheck
        language: system
        pass_filenames: false
        types: [python]

      # Tests are slow; run them on push rather than on every commit.
      - id: make-test
        name: Unit tests
        entry: make test
        language: system
        pass_filenames: false
        stages: [pre-push]
        types: [python]
