[project]
name = "pytest-test-observer"
version = "0.2.0"
description = "A pytest plugin for observing test execution events."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Dmitrii Shakhov", email = "sourx.rus@gmail.com" }
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Framework :: Pytest",
]
dependencies = [
    "pytest>=7.0",
    "clickhouse-connect>=0.6.0",
]

[project.optional-dependencies]
allure = ["allure-pytest>=2.13"]

[project.entry-points.pytest11]
test_observer = "pytest_test_observer.plugin"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "allure-pytest>=2.13",
    "pytest-xdist>=3.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=4.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:The configuration option \"asyncio_default_fixture_loop_scope\":pytest.PytestDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src/pytest_test_observer"]
omit = []

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@overload",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length is enforced by formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]   # `assert False` is fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# Analysis target — the package still runs on 3.9, but mypy itself needs >=3.10.
python_version = "3.10"
files = ["src"]
# clickhouse_connect / allure ship no type stubs; don't fail on their imports.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
# `strict` is the eventual goal; enable its sub-flags incrementally as the
# codebase gets fully annotated (start with disallow_untyped_defs per-module).
